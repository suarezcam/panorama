<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panorama | Generador de certificados</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;600&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root {
    --azul:   #2C4251;
    --azul-h: #3d5a6e;
    --gris:   #C1C1C1;
    --blanco: #FFFFFF;
    --fondo:  #EDECEA;
    --borde:  #E2E2DF;
    --muted:  #888888;
    --texto:  #333333;
    --error:  #B03A2E;
    --ok:     #2E7D4F;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Source Sans 3', sans-serif;
    background: var(--fondo);
    color: var(--azul);
    min-height: 100vh;
  }

  /* ── ENCABEZADO ── */
  .top {
    background: var(--azul);
    padding: 26px 40px 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand-accent { display: flex; flex-direction: column; gap: 5px; }
  .brand-accent i { display: block; height: 2px; border-radius: 2px; background: #fff; }
  .brand-accent i:nth-child(1) { width: 28px; opacity: .9; }
  .brand-accent i:nth-child(2) { width: 18px; opacity: .45; }
  .brand-accent i:nth-child(3) { width: 10px; opacity: .25; }
  .brand-name {
    display: block; font-size: 22px; font-weight: 200;
    letter-spacing: .16em; text-transform: uppercase; color: #fff; line-height: 1;
  }
  .brand-sub {
    display: block; margin-top: 5px; font-size: 9px; font-weight: 400;
    letter-spacing: .2em; text-transform: uppercase; color: rgba(255,255,255,.5);
  }
  .top-note {
    font-size: 10.5px; font-weight: 500; letter-spacing: .12em;
    text-transform: uppercase; color: rgba(255,255,255,.5);
  }

  /* ── PESTAÑAS ── */
  .tabs {
    max-width: 1240px; margin: 0 auto; padding: 28px 24px 0;
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .tab {
    background: var(--blanco); border: 1px solid var(--borde); border-radius: 20px;
    padding: 9px 20px; font-family: 'Source Sans 3', sans-serif; font-size: 11.5px;
    font-weight: 500; letter-spacing: .06em; color: var(--muted);
    cursor: pointer; transition: all .2s;
  }
  .tab:hover { border-color: var(--azul); color: var(--azul); }
  .tab.on { background: var(--azul); border-color: var(--azul); color: #fff; }

  /* ── ÁREA DE TRABAJO ── */
  .work {
    max-width: 1240px; margin: 0 auto; padding: 24px 24px 64px;
    display: grid; grid-template-columns: 360px 1fr; gap: 28px; align-items: start;
  }
  @media (max-width: 920px) { .work { grid-template-columns: 1fr; } }

  .panel {
    background: var(--blanco); border: 1px solid var(--borde); border-radius: 8px;
    padding: 26px 24px 24px; position: sticky; top: 16px;
  }
  @media (max-width: 920px) { .panel { position: static; } }
  .panel h2 { font-size: 17px; font-weight: 500; letter-spacing: .02em; margin-bottom: 6px; }
  .panel .desc {
    font-family: 'Source Serif 4', serif; font-size: 12.5px; font-weight: 300;
    color: var(--muted); line-height: 1.6; margin-bottom: 22px;
  }
  .fld { margin-bottom: 16px; }
  .fld label {
    display: block; font-size: 10px; font-weight: 600; letter-spacing: .14em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 6px;
  }
  .fld input, .fld textarea, .fld select {
    width: 100%; border: 1px solid var(--borde); border-radius: 5px;
    padding: 10px 12px; font-family: 'Source Serif 4', serif; font-size: 13.5px;
    color: var(--texto); background: #fff; outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  .fld textarea { resize: vertical; line-height: 1.5; }
  .fld input:focus, .fld textarea:focus, .fld select:focus {
    border-color: var(--azul); box-shadow: 0 0 0 3px rgba(44,66,81,.1);
  }
  .fld small { display: block; margin-top: 5px; font-size: 11px; color: var(--muted); }

  .actions { display: flex; gap: 10px; margin-top: 22px; }
  .btn {
    flex: 1; border-radius: 5px; padding: 12px 14px; cursor: pointer;
    font-family: 'Source Sans 3', sans-serif; font-size: 11px; font-weight: 600;
    letter-spacing: .12em; text-transform: uppercase; transition: all .2s;
  }
  .btn-main { background: var(--azul); color: #fff; border: 1px solid var(--azul); flex: 2; }
  .btn-main:hover { background: var(--azul-h); }
  .btn-main:disabled { opacity: .6; cursor: wait; }
  .btn-sec { background: none; color: var(--muted); border: 1px solid var(--borde); }
  .btn-sec:hover { border-color: var(--muted); color: var(--texto); }
  .msg { margin-top: 14px; font-size: 12px; font-weight: 500; min-height: 18px; line-height: 1.5; }
  .msg.error { color: var(--error); }
  .msg.ok { color: var(--ok); }
  .msg.info { color: var(--muted); }

  /* ── VISTA PREVIA ── */
  .stage-head {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 12px; gap: 12px; flex-wrap: wrap;
  }
  .stage-head span {
    font-size: 10px; font-weight: 600; letter-spacing: .18em;
    text-transform: uppercase; color: var(--gris);
  }
  .stage-head em { font-style: normal; font-size: 11px; color: var(--muted); }
  .stage-head em.warn { color: var(--error); font-weight: 500; }
  .wrap {
    width: 100%; overflow: hidden; background: #fff;
    border: 1px solid var(--borde); border-radius: 4px;
    box-shadow: 0 4px 24px rgba(0,0,0,.07);
  }
  .holder { width: 816px; transform-origin: top left; }

  /* ── HOJA (tamaño carta a 96 ppp: 816 x 1056) ── */
  .sheet {
    width: 816px; min-height: 1056px; background: #fff;
    padding: 64px 76px 56px; color: var(--texto);
    font-family: 'Source Serif 4', serif;
  }
  .s-header {
    display: flex; align-items: center; gap: 20px;
    margin-bottom: 44px; padding-bottom: 26px; border-bottom: 1px solid var(--borde);
  }
  .s-accent { display: flex; flex-direction: column; gap: 5px; flex-shrink: 0; }
  .s-accent i { display: block; height: 2px; border-radius: 2px; background: var(--azul); }
  .s-accent i:nth-child(1) { width: 28px; }
  .s-accent i:nth-child(2) { width: 18px; opacity: .45; }
  .s-accent i:nth-child(3) { width: 10px; opacity: .2; }
  .s-name {
    display: block; font-family: 'Source Serif 4', serif; font-size: 27px; font-weight: 400;
    color: var(--azul); letter-spacing: .2em; text-transform: uppercase; line-height: 1;
  }
  .s-sub {
    display: block; margin-top: 7px; font-family: 'Source Sans 3', sans-serif; font-size: 10px;
    font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: #6B7A85;
  }
  .s-title {
    font-family: 'Source Serif 4', serif; font-size: 25px; font-weight: 600;
    color: var(--azul); letter-spacing: .01em; margin-bottom: 28px;
  }
  .s-meta { display: flex; gap: 32px; margin-bottom: 28px; flex-wrap: wrap; }
  .s-ml {
    display: block; font-family: 'Source Sans 3', sans-serif; font-size: 9.5px; font-weight: 600;
    letter-spacing: .16em; text-transform: uppercase; color: #6B7A85; margin-bottom: 4px;
  }
  .s-mv { display: block; font-family: 'Source Sans 3', sans-serif; font-size: 12px; color: var(--azul); }
  .s-body { font-size: 13.5px; font-weight: 400; line-height: 1.75; }
  .s-body p { margin-bottom: 15px; }
  .s-body p:last-child { margin-bottom: 0; }
  .s-body strong { font-weight: 600; color: var(--azul); }
  .s-ref em { font-style: italic; }
  .s-ref {
    font-size: 12.5px; line-height: 1.7; padding: 10px 16px;
    border-left: 2px solid var(--gris); color: #444; white-space: pre-wrap;
  }
  .s-firma { margin-top: 44px; display: flex; flex-direction: column; gap: 4px; }
  .s-firma img { height: 64px; width: auto; align-self: flex-start; margin-bottom: 8px; }
  .s-firma .n { font-family: 'Source Sans 3', sans-serif; font-size: 13px; font-weight: 500; color: var(--azul); }
  .s-firma .c { font-family: 'Source Sans 3', sans-serif; font-size: 11.5px; font-weight: 400; color: #6B7A85; }
  .s-firma .e { font-family: 'Source Sans 3', sans-serif; font-size: 11px; color: var(--azul); }

  .ph {
    color: #9AA6AE; font-style: italic; background: #F1F4F6;
    border-radius: 2px; padding: 0 4px;
  }
  .val { white-space: pre-wrap; }

  /* Hoja temporal usada solo para generar el PDF */
  .export-stage { position: absolute; top: 0; left: 0; width: 816px; z-index: -1; pointer-events: none; }
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <div class="brand-accent"><i></i><i></i><i></i></div>
    <div>
      <span class="brand-name">Panorama</span>
      <span class="brand-sub">Generador de certificados</span>
    </div>
  </div>
  <span class="top-note">Tamaño carta · PDF listo para enviar</span>
</header>

<nav class="tabs" id="tabs"></nav>

<main class="work">
  <aside class="panel">
    <h2 id="p-title"></h2>
    <p class="desc" id="p-desc"></p>
    <div id="form"></div>
    <div class="actions">
      <button class="btn btn-sec" id="btn-clear" type="button">Limpiar</button>
      <button class="btn btn-main" id="btn-pdf" type="button">Descargar PDF</button>
    </div>
    <p class="msg" id="msg"></p>
  </aside>

  <section>
    <div class="stage-head">
      <span>Vista previa</span>
      <em id="pages"></em>
    </div>
    <div class="wrap" id="wrap">
      <div class="holder" id="holder"><div class="sheet" id="sheet"></div></div>
    </div>
  </section>
</main>

const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const SALUDOS = ['Respetado/a','Respetado','Respetada','Respetados','Respetadas'];

/* ── Utilidades ── */
const hoy = () => {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
};
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const partes = iso => iso.split('-').map(Number);
const fechaLarga = iso => {
  if (!iso) return '';
  const [y, m, d] = partes(iso);
  return d + ' de ' + MESES[m - 1] + ' de ' + y;
};
const fechaFirma = iso => {
  if (!iso) return '';
  const [y, m, d] = partes(iso);
  const dia = d === 1 ? 'al primer día' : 'a los ' + d + ' días';
  return dia + ' de ' + MESES[m - 1] + ' de ' + y;
};
const slug = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g,'')
  .replace(/[^a-zA-Z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0, 40);

/* Muestra el valor, o un marcador gris en la vista previa si está vacío */
const mk = preview => (texto, marcador) =>
  texto ? '<span class="val">' + esc(texto) + '</span>'
        : (preview ? '<span class="ph">' + esc(marcador) + '</span>' : '');
const mi = (etiqueta, html) => '<div><span class="s-ml">' + etiqueta + '</span><span class="s-mv">' + html + '</span></div>';

const PANORAMA_PAR =
  'Panorama es una publicación científica internacional editada desde el año 2007, de manera semestral, por la Institución Universitaria Politécnico Grancolombiano en Bogotá, Colombia. La revista está especializada en educación virtual y a distancia, y promueve la divulgación de investigaciones, reflexiones y experiencias que contribuyen a la actualización permanente de las comunidades académicas, pedagógicas y didácticas.';

/* ── Referencia APA 7 (artículo de revista) ── */
const finPunto = s => /[.?!]$/.test(s) ? s : s + '.';
const doiUrl = d => {
  d = String(d || '').trim().replace(/^doi:\s*/i, '');
  return /^10\./.test(d) ? 'https://doi.org/' + d : d;
};
function refHtml(v, P) {
  if (v.refModo === 'Escribir a mano') return P(v.referencia, 'referencia completa del artículo publicado');
  const aut = v.refAutores.trim() ? esc(finPunto(v.refAutores.trim())) : P('', 'Apellido, N.');
  const anio = v.anio ? '(' + esc(v.anio) + ').' : P('', '(año).');
  const tit = v.titulo.trim() ? esc(finPunto(v.titulo.trim())) : P('', 'Título del artículo.');
  const vol = v.volumen ? esc(v.volumen) : P('', 'vol.');
  const num = v.numero ? '(' + esc(v.numero) + ')' : '';
  const pag = v.refPaginas.trim() ? ', ' + esc(v.refPaginas.trim().replace(/\s*[-–]\s*/, '\u2013')) : '';
  const doi = v.refDoi.trim() ? ' ' + esc(doiUrl(v.refDoi)) : '';
  return aut + ' ' + anio + ' ' + tit + ' <em>Panorama, ' + vol + '</em>' + num + pag + '.' + doi;
}

      { key: 'volumen', label: 'Volumen', type: 'text', ph: '19' },
      { key: 'anio',    label: 'Año', type: 'text', def: () => String(new Date().getFullYear()) },
      { key: 'refModo', label: 'Referencia APA 7', type: 'select', options: ['Generar con campos','Escribir a mano'], rebuild: true },
      { key: 'refAutores', label: 'Autores', type: 'text', ph: 'Suárez-Acevedo, C., & Cabarcas, A.', hint: 'Formato APA 7: Apellido, N. Separe con comas y use & antes del último.', show: v => v.refModo !== 'Escribir a mano' },
      { key: 'refPaginas', label: 'Páginas', type: 'text', ph: '1-20', show: v => v.refModo !== 'Escribir a mano' },
      { key: 'refDoi', label: 'DOI (opcional)', type: 'text', ph: '10.15765/xxxxxxxx', hint: 'Acepta el DOI solo o el enlace completo.', opt: true, show: v => v.refModo !== 'Escribir a mano' },
      { key: 'referencia', label: 'Referencia completa (escrita a mano)', type: 'textarea', rows: 5, show: v => v.refModo === 'Escribir a mano' },
      { key: 'fecha',  label: 'Fecha de firma', type: 'date', def: hoy }
    ],
    file: v => 'Certificado_autor_' + slug(v.nombre),
    body: (v, P) =>
      '<p>Que <strong>' + P(v.nombre, 'nombre del autor o autora') + '</strong> ' +
        (v.plural === 'Varias personas' ? 'sometieron' : 'sometió') + ' el manuscrito titulado &ldquo;' + P(v.titulo, 'título del artículo') +
        '&rdquo;, el cual fue aceptado en el marco del proceso editorial correspondiente al número ' + P(v.numero, 'núm.') +
        ', volumen ' + P(v.volumen, 'vol.') + ' de ' + P(v.anio, 'año') + ' de la revista Panorama.</p>' +
      '<p>La referencia del artículo publicado es la siguiente:</p>' +
      '<p class="s-ref">' + refHtml(v, P) + '</p>' +
      '<p>Panorama (ISSN-L: 1909-7433 / E-ISSN: 2145-308X) es una publicación internacional editada desde el año 2007, de manera semestral por la Institución Universitaria Politécnico Grancolombiano en Bogotá, Colombia. Se encuentra indizada en las siguientes bases de datos: Redalyc, Emerging Sources Citation Index (ESCI), Latindex, DOAJ.</p>' +
      '<p>El objetivo de la Revista Panorama es promover y visibilizar los resultados de investigación para la actualización y diálogo permanente de comunidades interesadas en mejorar sus prácticas académicas, pedagógicas y didácticas mediadas por entornos virtuales de aprendizaje.</p>' +
      '<p>La presente se firma ' + P(fechaFirma(v.fecha), 'fecha de firma') + '.</p>'
  }
};

/* ── Estado ── */
const ORDEN = Object.keys(DOCS);
let cur = ORDEN[0];
const state = {};
const defaults = id => {
  const v = {};
  DOCS[id].fields.forEach(f => {
    v[f.key] = f.def ? f.def() : (f.type === 'select' ? f.options[0] : '');
  });
  return v;
};
ORDEN.forEach(id => state[id] = defaults(id));

/* ── Referencias al DOM ── */
const $ = id => document.getElementById(id);
const sheet = $('sheet'), holder = $('holder'), wrap = $('wrap');

/* ── Hoja ── */
function sheetInner(id, v, preview) {
  const d = DOCS[id], P = mk(preview);
  const meta = d.meta ? d.meta(v, P) : '';
  return '<div class="s-header"><div class="s-accent"><i></i><i></i><i></i></div>' +
         '<div><span class="s-name">Panorama</span><span class="s-sub">Revista científica especializada en educación</span></div></div>' +
         '<h1 class="s-title">' + d.title + '</h1>' +
         (meta ? '<div class="s-meta">' + meta + '</div>' : '') +
         '<div class="s-body">' + d.body(v, P) + '</div>' +
         '<div class="s-firma"><img src="' + FIRMA + '" alt="Firma">' +
         '<span class="n">Camila Suárez-Acevedo, Ph.D</span><span class="c">Editora</span>' +
         '<span class="e">panorama@poligran.edu.co</span></div>';
}

function fit() {
  const s = Math.min(1, wrap.clientWidth / 816);
  holder.style.transform = 'scale(' + s + ')';
  wrap.style.height = Math.ceil(sheet.offsetHeight * s) + 'px';
}

function renderPreview() {
  sheet.innerHTML = sheetInner(cur, state[cur], true);
  fit();
  const n = Math.max(1, Math.ceil((sheet.offsetHeight - 2) / 1056));
  const em = $('pages');
  em.textContent = n === 1 ? 'Una página' : 'El texto excede una página y se generarán ' + n + ' páginas';
  em.className = n === 1 ? '' : 'warn';
}

/* ── Formulario ── */
function buildForm() {
  const d = DOCS[cur], v = state[cur];
  $('p-title').textContent = d.label;
  $('p-desc').textContent = d.desc;
  $('form').innerHTML = d.fields.filter(f => !f.show || f.show(v)).map(f => {
    const id = 'f_' + f.key;
    let input;
    if (f.type === 'textarea') {
      input = '<textarea id="' + id + '" rows="' + (f.rows || 3) + '" placeholder="' + esc(f.ph || '') + '">' + esc(v[f.key] || '') + '</textarea>';
    } else if (f.type === 'select') {
      input = '<select id="' + id + '">' + f.options.map(o =>
        '<option value="' + esc(o) + '"' + (v[f.key] === o ? ' selected' : '') + '>' + esc(o) + '</option>').join('') + '</select>';
    } else {
      input = '<input id="' + id + '" type="' + (f.type || 'text') + '" value="' + esc(v[f.key] || '') + '" placeholder="' + esc(f.ph || '') + '">';
    }
    return '<div class="fld"><label for="' + id + '">' + f.label + '</label>' + input + (f.hint ? '<small>' + f.hint + '</small>' : '') + '</div>';
  }).join('');
  d.fields.filter(f => !f.show || f.show(v)).forEach(f => {
    $('f_' + f.key).addEventListener('input', e => {
      state[cur][f.key] = e.target.value;
      setMsg('');
      if (f.rebuild) buildForm();
      renderPreview();
    });
  });
}

function setMsg(texto, tipo) {
  const m = $('msg');
  m.textContent = texto || '';
  m.className = 'msg' + (tipo ? ' ' + tipo : '');
}

function selectDoc(id) {
  cur = id;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.id === id));
  setMsg('');
  buildForm();
  renderPreview();
}

/* ── Pestañas ── */
$('tabs').innerHTML = ORDEN.map(id =>
  '<button class="tab" type="button" data-id="' + id + '">' + DOCS[id].label + '</button>').join('');
$('tabs').addEventListener('click', e => {
  const b = e.target.closest('.tab');
  if (b) selectDoc(b.dataset.id);
});

$('btn-clear').addEventListener('click', () => {
  state[cur] = defaults(cur);
  setMsg('');
  buildForm();
  renderPreview();
});

/* ── Descarga del PDF ── */
$('btn-pdf').addEventListener('click', async () => {
  const d = DOCS[cur], v = state[cur];
  const faltan = d.fields.filter(f => (!f.show || f.show(v)) && !f.opt && !String(v[f.key] || '').trim());
  if (faltan.length) {
    setMsg('Faltan campos por completar: ' + faltan.map(f => f.label.toLowerCase()).join(', ') + '.', 'error');
    return;
  }
  if (!window.html2canvas || !window.jspdf) {
    setMsg('No se cargaron las librerías de PDF. Verifique la conexión a internet y recargue la página.', 'error');
    return;
  }
  const btn = $('btn-pdf');
  btn.disabled = true;
  setMsg('Generando el PDF...', 'info');
  let stage;
  try {
    await document.fonts.ready;
    stage = document.createElement('div');
    stage.className = 'export-stage';
    stage.innerHTML = '<div class="sheet">' + sheetInner(cur, v, false) + '</div>';
    document.body.appendChild(stage);
    const el = stage.firstElementChild;
    await Promise.all([...el.querySelectorAll('img')].map(i => i.decode ? i.decode().catch(() => {}) : Promise.resolve()));

    const canvas = await html2canvas(el, { scale: 3, backgroundColor: '#ffffff', useCORS: true, logging: false });
    stage.remove(); stage = null;

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit: 'pt', format: 'letter' });
    const anchoPt = 612;
    const altoPaginaPx = Math.floor(canvas.width * 792 / 612);
    let y = 0, pagina = 0;
    while (y < canvas.height - 4) {
      const alto = Math.min(altoPaginaPx, canvas.height - y);
      const trozo = document.createElement('canvas');
      trozo.width = canvas.width; trozo.height = alto;
      const ctx = trozo.getContext('2d');
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, trozo.width, trozo.height);
      ctx.drawImage(canvas, 0, y, canvas.width, alto, 0, 0, canvas.width, alto);
      if (pagina > 0) pdf.addPage();
      pdf.addImage(trozo.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, anchoPt, alto * anchoPt / canvas.width);
      y += altoPaginaPx; pagina++;
    }
    pdf.save(d.file(v) + '.pdf');
    setMsg('PDF descargado: ' + d.file(v) + '.pdf', 'ok');
  } catch (err) {
    console.error(err);
    setMsg('No fue posible generar el PDF. Recargue la página e intente de nuevo.', 'error');
  } finally {
    if (stage) stage.remove();
    btn.disabled = false;
  }
});

window.addEventListener('resize', fit);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
selectDoc(cur);
</script>
</body>
</html>
